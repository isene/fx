[package]
name = "fx"
version = "0.1.0"
edition = "2021"
description = "The views and effects of the desktop, each with a tick box"
license = "Unlicense"
repository = "https://github.com/isene/fx"
authors = ["Geir Isene <g@isene.com>"]

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
